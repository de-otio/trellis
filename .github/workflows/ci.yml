name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# MED-1 (2026-08 security review): id-token: write used to be granted here
# at top level, to every job — including lint-and-test, which checks out and
# runs `npm ci` + tests against untrusted fork-PR code on `pull_request`.
# Nothing in this workflow exchanges an OIDC token (no configure-aws-credentials,
# no npm Trusted Publishing here — that's publish.yml, tag-triggered, a separate
# workflow with its own narrowly-scoped id-token job); the permission had no
# consumer and was pure downside: a malicious test/postinstall on a fork PR could
# mint an OIDC token scoped to this repo/workflow and try to exchange it against
# whatever trust policy would accept a `workflow_ref` of `ci.yml`. Removed. If a
# genuine future need arises, scope id-token to the single job that needs it —
# never the job running PR-head code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # PostGIS image (matches docker-compose): the entity_location migration
        # runs `CREATE EXTENSION IF NOT EXISTS postgis`, which needs the
        # extension control files the plain postgres:alpine image lacks (C7).
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: trellis_test
          POSTGRES_USER: trellis
          POSTGRES_PASSWORD: test-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
        options: --health-cmd "curl -s http://localhost:8000" --health-interval 5s

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://trellis:test-ci-password@localhost:5432/trellis_test

      - name: Run migrations
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://trellis:test-ci-password@localhost:5432/trellis_test
          DIRECT_DATABASE_URL: postgresql://trellis:test-ci-password@localhost:5432/trellis_test

      - name: Build workspace packages
        run: npm run build -w @de-otio/trellis

      - name: Lint (TypeScript)
        run: npm run lint -w @de-otio/trellis

      # AR14: fail the build if a new UNCONDITIONAL `it.skip`/`describe.skip`/
      # `.only` shows up that isn't in the annotated baseline. The legitimate
      # `describe.skipIf(cond)` / `TEST_DB_URL ? describe : describe.skip`
      # env-guard patterns are intentionally invisible to this check — see
      # apps/api/scripts/check-new-skips.mjs and apps/api/test/skip-baseline.json.
      - name: No new unconditional test skips/only
        run: node apps/api/scripts/check-new-skips.mjs

      - name: Run tests
        run: npm test -w @de-otio/trellis
        env:
          DATABASE_URL: postgresql://trellis:test-ci-password@localhost:5432/trellis_test
          DYNAMODB_ENDPOINT: http://localhost:8000
          DYNAMODB_TABLE: test-trellis
          STAGE: test
          NODE_ENV: test
          SESSION_SECRET: test-session-secret-must-be-32chars!!
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

      # Coverage gate — Surveillance-hardening Phase 0. Enforces 80%
      # lines/branches/functions/statements on the NEW source files this plan
      # adds (vitest.coverage-ci.config.ts). The repo-wide 80% gate is NOT
      # wired here: the `main` baseline already sits at ~78% branches (a legacy
      # gap, not this plan's), so a global gate would fail for unrelated
      # reasons. `all: true` makes an untested new file fail the gate.
      - name: Coverage gate (Phase 0 new files)
        run: npm run test:coverage:ci -w @de-otio/trellis
        env:
          DATABASE_URL: postgresql://trellis:test-ci-password@localhost:5432/trellis_test
          DYNAMODB_ENDPOINT: http://localhost:8000
          DYNAMODB_TABLE: test-trellis
          STAGE: test
          NODE_ENV: test
          SESSION_SECRET: test-session-secret-must-be-32chars!!
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

      # Repo-wide coverage floor. Full-suite coverage clears vitest.config.ts's
      # thresholds (verified 2026-07-02: ~87.2% stmts / 80.9% branches / 88.2%
      # funcs / 87.7% lines) — wire it in directly instead of leaving it
      # aspirational-only.
      - name: Coverage gate (repo-wide floor)
        run: npm run test:coverage -w @de-otio/trellis
        env:
          DATABASE_URL: postgresql://trellis:test-ci-password@localhost:5432/trellis_test
          DYNAMODB_ENDPOINT: http://localhost:8000
          DYNAMODB_TABLE: test-trellis
          STAGE: test
          NODE_ENV: test
          SESSION_SECRET: test-session-secret-must-be-32chars!!
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

      # Consumer-install smoke: pack, install with --omit=dev into a fresh
      # project, require every published entry point. Catches runtime
      # imports of devDeps and unshipped relative imports — gaps the
      # in-repo tests can't see because they run with the full source
      # tree + devDeps installed.
      - name: Consumer-install smoke test
        run: bash apps/api/scripts/smoke-pack.sh

  standalone:
    name: Standalone lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # PostGIS image (matches docker-compose): the entity_location migration
        # runs `CREATE EXTENSION IF NOT EXISTS postgis`, which needs the
        # extension control files the plain postgres:alpine image lacks (C7).
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: trellis_dev
          POSTGRES_USER: trellis
          POSTGRES_PASSWORD: trellis_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
        options: --health-cmd "curl -s http://localhost:8000" --health-interval 5s

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://trellis:trellis_dev_password@localhost:5432/trellis_dev

      - name: Run migrations
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://trellis:trellis_dev_password@localhost:5432/trellis_dev
          DIRECT_DATABASE_URL: postgresql://trellis:trellis_dev_password@localhost:5432/trellis_dev

      # Boots the real server in-process with the dummy-target extensions and
      # drives the full HTTP path — no AWS account, no consuming vertical.
      # The standalone-env defaults point at the service containers above.
      - name: Run standalone lane
        run: npm run test:standalone -w @de-otio/trellis

  testkit:
    name: Testkit lane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same stack the standalone lane uses, because the testkit's job is to
    # package exactly that. What differs is which copy of core it exercises:
    # the standalone lane boots `src` (a pre-publish gate on the working tree),
    # this one resolves `@de-otio/trellis` from node_modules and boots `dist`
    # (a gate on what a consumer actually installs). Neither substitutes for
    # the other, which is why both exist.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: trellis_dev
          POSTGRES_USER: trellis
          POSTGRES_PASSWORD: trellis_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
        options: --health-cmd "curl -s http://localhost:8000" --health-interval 5s

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://trellis:trellis_dev_password@localhost:5432/trellis_dev

      # The testkit resolves `@de-otio/trellis` to apps/api/dist, so unlike
      # every other lane this one genuinely needs the build. It deliberately
      # does NOT run migrations here: applying them is the testkit's own job
      # and this lane is what proves it does it.
      - name: Build core
        run: npm run build

      - name: Typecheck the testkit (façade vs core's real API)
        run: npm run test:types -w @de-otio/trellis-extension-testkit

      - name: Run testkit lane
        run: npm test -w @de-otio/trellis-extension-testkit

  graph:
    name: Graph lane (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The graph layer runs in Postgres (graph-db revisit 2026-06). This lane
    # exercises the SQL that mocked unit tests cannot verify: the recursive
    # discovery CTE and the dual-gated visibility query (a privacy control),
    # against a real PostGIS-enabled Postgres. The schema is materialized
    # with `prisma migrate deploy` — since the pre-launch init migration the
    # graph edge tables ship IN the migrations (the old `db push` here was
    # papering over their absence), so this lane now also proves a fresh
    # deploy produces a working graph.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: trellis_test
          POSTGRES_USER: trellis
          POSTGRES_PASSWORD: trellis_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trellis -d trellis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Generate the Prisma client the Postgres graph adapter needs at runtime
      # (PostgresGraphService instantiates it). Prisma 7's `db push` no longer
      # generates the client as a side effect, so do it explicitly.
      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run migrations
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://trellis:trellis_test_password@localhost:5432/trellis_test
          DIRECT_DATABASE_URL: postgresql://trellis:trellis_test_password@localhost:5432/trellis_test

      - name: Run graph lane
        run: npm run test:graph -w @de-otio/trellis
        env:
          DATABASE_URL: postgresql://trellis:trellis_test_password@localhost:5432/trellis_test
          DIRECT_DATABASE_URL: postgresql://trellis:trellis_test_password@localhost:5432/trellis_test
          STAGE: test

  schema-drift:
    name: Schema-drift guard
    # Pre-launch schema end-state pass: after the single clean init migration,
    # schema.prisma and prisma/migrations/ must move in lockstep. This job
    # applies the migrations to a scratch Postgres and diffs the result
    # against schema.prisma (apps/api/scripts/check-schema-drift.sh) — it
    # FAILS when the schema was edited without generating a migration. The
    # hand-written migration objects (partial uniques, GIN/GiST indexes) are
    # allowlisted in the script.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: trellis_drift
          POSTGRES_USER: trellis
          POSTGRES_PASSWORD: trellis_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trellis -d trellis_drift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Runs BEFORE the migrations, and needs no database: `prisma migrate dev`
      # proposes dropping the GiST / gin_trgm_ops indexes it cannot express in
      # schema.prisma, and applying that generated SQL silently destroys
      # geo-proximity and directory search. Two migrations have already hit it.
      # See scripts/check-migration-sql.mjs.
      - name: Guard against unjustified DROP INDEX in migrations
        timeout-minutes: 2
        run: node scripts/check-migration-sql.mjs

      - name: Run migrations
        timeout-minutes: 5
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://trellis:trellis_test_password@localhost:5432/trellis_drift
          DIRECT_DATABASE_URL: postgresql://trellis:trellis_test_password@localhost:5432/trellis_drift

      - name: Check schema drift (schema.prisma vs migrations)
        timeout-minutes: 5
        run: bash apps/api/scripts/check-schema-drift.sh
        env:
          DATABASE_URL: postgresql://trellis:trellis_test_password@localhost:5432/trellis_drift

  schema:
    name: Schema-shape lane (Postgres)
    # Surveillance-hardening Phase 0 (P1): the schema-shape integration tests
    # in test/integration/schema/ assert column nullability, indexes, the
    # FeatureToggle partial-unique index, and FK cascades against a real
    # Postgres. `npm test` excludes test/integration/**, so without this lane
    # these tests would never gate a merge.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: trellis_test
          POSTGRES_USER: trellis
          POSTGRES_PASSWORD: trellis_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trellis -d trellis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://trellis:trellis_test_password@localhost:5432/trellis_test

      - name: Run migrations
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://trellis:trellis_test_password@localhost:5432/trellis_test
          DIRECT_DATABASE_URL: postgresql://trellis:trellis_test_password@localhost:5432/trellis_test

      - name: Run schema-shape lane
        run: npm run test:schema -w @de-otio/trellis
        env:
          DATABASE_URL: postgresql://trellis:trellis_test_password@localhost:5432/trellis_test
          DIRECT_DATABASE_URL: postgresql://trellis:trellis_test_password@localhost:5432/trellis_test
          STAGE: test

  integration:
    name: Integration lane (Postgres, Phase 0 scope)
    # Surveillance-hardening Phase 0 (P1): a CURATED integration lane. The
    # broad test:integration suite needs live infra beyond Postgres (media,
    # a running API, Entra), so this lane runs only the Postgres-only Phase 0
    # integration tests listed in vitest.integration-ci.config.ts. It passes
    # with no tests until P2/P4 populate that list.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: trellis_test
          POSTGRES_USER: trellis
          POSTGRES_PASSWORD: trellis_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trellis -d trellis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
        options: --health-cmd "curl -s http://localhost:8000" --health-interval 5s

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://trellis:trellis_test_password@localhost:5432/trellis_test

      - name: Run migrations
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://trellis:trellis_test_password@localhost:5432/trellis_test
          DIRECT_DATABASE_URL: postgresql://trellis:trellis_test_password@localhost:5432/trellis_test

      - name: Run integration lane (Phase 0 scope)
        run: npm run test:integration:ci -w @de-otio/trellis
        env:
          DATABASE_URL: postgresql://trellis:trellis_test_password@localhost:5432/trellis_test
          DIRECT_DATABASE_URL: postgresql://trellis:trellis_test_password@localhost:5432/trellis_test
          DYNAMODB_ENDPOINT: http://localhost:8000
          DYNAMODB_TABLE: test-trellis
          STAGE: test
          NODE_ENV: test
          SESSION_SECRET: test-session-secret-must-be-32chars!!
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
