name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # PostGIS image (matches docker-compose): the entity_location migration
        # runs `CREATE EXTENSION IF NOT EXISTS postgis`, which needs the
        # extension control files the plain postgres:alpine image lacks (C7).
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: trellis_test
          POSTGRES_USER: trellis
          POSTGRES_PASSWORD: test-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
        options: --health-cmd "curl -s http://localhost:8000" --health-interval 5s

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://trellis:test-ci-password@localhost:5432/trellis_test

      - name: Run migrations
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://trellis:test-ci-password@localhost:5432/trellis_test
          DIRECT_DATABASE_URL: postgresql://trellis:test-ci-password@localhost:5432/trellis_test

      - name: Build workspace packages
        run: npm run build -w @de-otio/trellis

      - name: Lint (TypeScript)
        run: npm run lint -w @de-otio/trellis

      - name: Run tests
        run: npm test -w @de-otio/trellis
        env:
          DATABASE_URL: postgresql://trellis:test-ci-password@localhost:5432/trellis_test
          DYNAMODB_ENDPOINT: http://localhost:8000
          DYNAMODB_TABLE: test-trellis
          STAGE: test
          NODE_ENV: test
          SESSION_SECRET: test-session-secret-must-be-32chars!!
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

      # Consumer-install smoke: pack, install with --omit=dev into a fresh
      # project, require every published entry point. Catches runtime
      # imports of devDeps and unshipped relative imports — gaps the
      # in-repo tests can't see because they run with the full source
      # tree + devDeps installed.
      - name: Consumer-install smoke test
        run: bash apps/api/scripts/smoke-pack.sh

  standalone:
    name: Standalone lane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # PostGIS image (matches docker-compose): the entity_location migration
        # runs `CREATE EXTENSION IF NOT EXISTS postgis`, which needs the
        # extension control files the plain postgres:alpine image lacks (C7).
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: trellis_dev
          POSTGRES_USER: trellis
          POSTGRES_PASSWORD: trellis_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
        options: --health-cmd "curl -s http://localhost:8000" --health-interval 5s
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/trellis_dev_password
        ports: ["7687:7687", "7474:7474"]
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://trellis:trellis_dev_password@localhost:5432/trellis_dev

      - name: Run migrations
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://trellis:trellis_dev_password@localhost:5432/trellis_dev
          DIRECT_DATABASE_URL: postgresql://trellis:trellis_dev_password@localhost:5432/trellis_dev

      # Boots the real server in-process with the dummy-target extensions and
      # drives the full HTTP path — no AWS account, no consuming vertical.
      # The standalone-env defaults point at the service containers above.
      - name: Run standalone lane
        run: npm run test:standalone -w @de-otio/trellis

  graph:
    name: Graph lane (Neo4j)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No Postgres/DynamoDB: the graph integration tests talk only to Neo4j
    # via the neo4j-driver. No prisma:generate either — the graph source
    # type-imports @prisma/client (erased at runtime by esbuild), so a
    # generated client is not required to run this lane.
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/trellis_dev_password
        ports: ["7687:7687", "7474:7474"]
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The HTTP health-check (7474) goes green before Bolt (7687) can
      # authenticate. Poll Bolt with RETURN 1 so the test step starts only
      # once the DB truly accepts queries — avoids cold-start flakiness.
      - name: Wait for Neo4j Bolt
        run: node apps/api/scripts/wait-for-neo4j.mjs
        env:
          NEO4J_TEST_URI: bolt://localhost:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: trellis_dev_password

      # Community edition has no multi-database, so the tests run against the
      # default "neo4j" db with an explicit opt-in. STAGE=test keeps the
      # prod-refusal and wipe guards in setup.ts/harness.ts satisfied.
      - name: Run graph lane
        run: npm run test:graph -w @de-otio/trellis
        env:
          NEO4J_TEST_URI: bolt://localhost:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: trellis_dev_password
          NEO4J_TEST_DATABASE: neo4j
          NEO4J_TEST_ALLOW_DEFAULT_DB: "1"
          STAGE: test
