# Auto-merge Dependabot PRs once CI is green.
#
# Green CI is the only gate — there is no manual review of dependency bumps
# (see CONTRIBUTING.md). This enables GitHub's native auto-merge on each
# Dependabot PR; the merge happens only after the required status checks
# (the CI workflow's lanes) pass. Branch protection on `main` defines those
# required checks, and "Allow auto-merge" must be enabled on the repo.
#
# Note: enabling auto-merge with the default GITHUB_TOKEN is intentional. The
# subsequent merge to `main` is what dependabot-release.yml keys off; if the
# release chain ever stops firing, wire a GitHub App / PAT here instead of
# GITHUB_TOKEN so the merge push triggers downstream workflows.

name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
