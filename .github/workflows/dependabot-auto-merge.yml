# Thin caller for the org's reusable Dependabot merge gate.
# DRAFT (brakes rollout, decision D7); the gate and its scripts live in de-otio/.github.
# PIN: e2edf79b86fd4684c1fa48473158a7250b07d2fa is filled with the merged de-otio/.github commit SHA by dependabot/scripts/pin-callers.sh; the reusable workflow refuses any other scripts-ref.
# Needs the labels `needs-human-review` and `major-bump` to exist in this repo.
name: Dependabot auto-merge

on:
  pull_request_target:
    # `labeled` so a human adding `needs-human-review` turns auto-merge off.
    types: [opened, reopened, synchronize, labeled]

# Nothing by default; the job below asks for what the reusable workflow needs.
permissions: {}

# Per PR number, not github.ref (for pull_request_target, ref is the base branch).
# No cancel-in-progress. Keep this block in the CALLER only.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'needs-human-review') && github.run_id || 'gate' }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: de-otio/.github/.github/workflows/dependabot-gate.yml@e2edf79b86fd4684c1fa48473158a7250b07d2fa
    with:
      ecosystems: npm,github-actions
      scripts-ref: e2edf79b86fd4684c1fa48473158a7250b07d2fa
      # trellis keeps its current behaviour until the merger App replaces the per-repo merge step.
      enable-auto-merge: true
      # PLACEHOLDER(merger-app): leave as is until the merger App design lands.
      merge-identity: github-token
