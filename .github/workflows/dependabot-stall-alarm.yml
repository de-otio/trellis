# Thin caller for the org's reusable Dependabot stall alarm.
# DRAFT (brakes rollout, decision D7).
# Owner setup: the secret NTFY_TOPIC must be available to this repo (repo or org secret).
# PIN: e2edf79b86fd4684c1fa48473158a7250b07d2fa is filled with the merged de-otio/.github commit SHA by dependabot/scripts/pin-callers.sh; the reusable workflow refuses any other scripts-ref.
name: Dependabot stall alarm

on:
  schedule:
    # Daily; the minute differs per repo to dodge scheduler congestion.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-stall-alarm
  cancel-in-progress: false

jobs:
  alarm:
    permissions:
      contents: read
      pull-requests: read
    uses: de-otio/.github/.github/workflows/dependabot-stall-alarm.yml@e2edf79b86fd4684c1fa48473158a7250b07d2fa
    with:
      scripts-ref: e2edf79b86fd4684c1fa48473158a7250b07d2fa
    secrets:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
