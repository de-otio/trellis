name: Publish

# Tag-triggered npm publish for the two publishable packages in this
# monorepo. Uses npm Trusted Publishing via OIDC — the package must be
# registered as a Trusted Publisher on npmjs.org first; once set up,
# subsequent tagged releases publish without any manual OTP.
#
# Tag formats:
#   v<version>                  → @de-otio/trellis            (apps/api)
#   extension-api-v<version>    → @de-otio/trellis-extension-api  (packages/extension-api)
#
# The workflow verifies that the tag's version matches the target
# package.json's version before publishing, so a bad tag can't publish
# the wrong thing.

on:
  push:
    tags:
      - 'v*'
      - 'extension-api-v*'

permissions:
  contents: read
  id-token: write  # OIDC for Trusted Publishing

# Serialize publishes per tag; never cancel an in-flight publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 ships npm v11. npm Trusted Publishing requires npm >= 11.5.1;
      # Node 22 ships npm 10 which fails with a misleading "404 Not Found"
      # on PUT immediately after provenance is signed.
      # Ref: https://medium.com/@kenricktan11/npm-trusted-publishers-the-weird-404-error-and-the-node-js-24-fix-a9f1d717a5dd
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # Prisma 7's bare @prisma/client has no types until generated; the build
      # (tsc) needs them or model types collapse to {} / unknown.
      - run: npm run prisma:generate

      - run: npm run build

      - name: Determine target package from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          case "$TAG" in
            extension-api-v*)
              DIR="packages/extension-api"
              NAME="@de-otio/trellis-extension-api"
              EXPECTED_VERSION="${TAG#extension-api-v}"
              ;;
            v*)
              DIR="apps/api"
              NAME="@de-otio/trellis"
              EXPECTED_VERSION="${TAG#v}"
              ;;
            *)
              echo "::error::Unrecognised tag format: $TAG (expected v<x> or extension-api-v<x>)"
              exit 1
              ;;
          esac
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "expected_version=$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify package.json version matches tag
        run: |
          cd "${{ steps.pkg.outputs.dir }}"
          ACTUAL=$(node -p "require('./package.json').version")
          EXPECTED="${{ steps.pkg.outputs.expected_version }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Tag version ($EXPECTED) does not match package.json version ($ACTUAL) for ${{ steps.pkg.outputs.name }}"
            exit 1
          fi

      # Consumer-install smoke: pack, install with --omit=dev into a fresh
      # project, load every published entry point. Catches runtime imports of
      # devDeps and unshipped relative imports before publishing.
      #
      # This used to be skipped for extension-api, on the grounds that it "has
      # no Lambda/server entry points to load". That stopped being true in
      # 0.9.0: extension-api now declares an `exports` map, and declaring one
      # DISABLES Node's extension probing — the failure mode that broke twenty
      # of twenty-one entry points on @de-otio/trellis earlier this month. A
      # resolution defect is invisible to every gate that runs against `src/`,
      # so the one gate that packs a real tarball is exactly the one the
      # riskiest publish must not skip. The script covers both packages.
      - name: Consumer-install smoke test
        run: bash apps/api/scripts/smoke-pack.sh

      - name: Select dist-tag from version
        id: disttag
        run: |
          VERSION="${{ steps.pkg.outputs.expected_version }}"
          case "$VERSION" in
            *-alpha*) TAG=alpha ;;
            *-beta*)  TAG=beta ;;
            *-rc*)    TAG=rc ;;
            *-*)      TAG=next ;;
            *)        TAG=latest ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The `prepack` script in apps/api/package.json copies
      # ../../prisma into ./prisma so the published tarball ships the
      # schema + migrations alongside dist/. The `postpack` script
      # cleans up afterwards. We rely on this — do NOT add
      # --ignore-scripts.
      #
      # --provenance: this repo (de-otio/trellis) is public, so npm can
      # verify the sigstore provenance bundle against the GitHub Actions
      # source repository. (npm provenance 422s with "Unsupported GitHub
      # Actions source repository visibility: private" on a private repo —
      # not applicable here. If this workflow is ever reused from a fork
      # or a private mirror, drop --provenance there.)
      - name: Publish ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.expected_version }}
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --access public --tag "${{ steps.disttag.outputs.tag }}" --provenance
