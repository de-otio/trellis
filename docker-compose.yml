services:
  postgres:
    # PostGIS-enabled Postgres 16 — the entity-location subsystem (C7) needs
    # geography columns + ST_DWithin/GiST for geo-proximity. Same PG16 on-disk
    # format as postgres:16-alpine, so the existing volume is reused.
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: trellis_dev
      POSTGRES_USER: trellis
      POSTGRES_PASSWORD: trellis_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trellis -d trellis_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  dynamodb:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    # In-memory mode: ephemeral and fast, the recommended mode for tests. The
    # file-backed (-dbPath) engine can deadlock on the mounted volume, hanging
    # every DynamoDB operation while the HTTP port still answers.
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"

  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs,ses
      DEFAULT_REGION: us-east-1
      DEBUG: 0
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

  # Neo4j backs the graph layer (relationships, circles, discovery). The
  # standalone test lane and `npm run test:graph` use the `test` database on
  # this instance — no manual setup required once the stack is up.
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474" # HTTP browser
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/trellis_dev_password
      # Community edition allows only the default "neo4j" db; the graph/standalone
      # configs target it directly (NEO4J_TEST_DATABASE=neo4j).
      NEO4J_dbms_security_auth__minimum__password__length: "8"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  localstack_data:
  neo4j_data:
